# 前端 Nginx 配置（离线版本）—— 纯静态服务，不反代后端
#
# 与 nginx.conf 的差异：
#   - 删掉所有 /api/ /api/admin/ /api/metrics/ /api/scheduler/ 的 proxy_pass
#   - 数据全部来自 /mock/*.json（已随 SSG 产物拷到 root 下）
#   - 没有 report-query / report-generation 容器也能起，不会 502 / upstream not found

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 健康探针
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback —— Nuxt SSG 的 404 也兜到 index
    # /mock/*.json 走 $uri 第一段就命中，不会兜到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|ico)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # mock JSON 短缓存（方便切版本时刷新）
    location ~* ^/mock/.*\.json$ {
        access_log off;
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }
}
