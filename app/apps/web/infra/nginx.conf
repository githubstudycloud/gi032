# 前端 Nginx 配置 —— 同时承担：
#   1. 静态文件服务（Nuxt SSG 产物）
#   2. /api -> report-query 反代（同源，零 CORS）
#   3. /admin -> report-generation 反代（写路径走另一个服务）

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 健康探针
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # API 反代到查询服务（只读）
    location /api/ {
        # admin / metrics / scheduler 显式走 generation（在它前面）
        proxy_pass         http://report-query:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 写路径反代到生成服务 —— 优先匹配
    location /api/admin/ {
        proxy_pass         http://report-generation:8002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization     $http_authorization;
        proxy_read_timeout 60s;
    }

    location /api/metrics/ingest {
        proxy_pass         http://report-generation:8002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization     $http_authorization;
        proxy_read_timeout 60s;
        client_max_body_size 50m;
    }

    location /api/scheduler/ {
        proxy_pass         http://report-generation:8002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }

    # SPA fallback —— Nuxt SSG 的 404 也兜到 index
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|ico)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
